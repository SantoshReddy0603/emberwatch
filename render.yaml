services:
  - type: web
    name: emberwatch
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FLEET_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: ember-demo
      - key: SEED_ON_START
        value: '1'
      - key: SIM_EMBEDDED
        value: '1'
      - key: SIM_HZ
        value: '1'
      - key: RAW_TTL_MINUTES
        value: '60'
      - key: ROLLUP_TTL_HOURS
        value: '24'
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
